<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso — Chácaras São Francisco &amp; Magnólia</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              900: '#064e3b'
            }
          }
        }
      }
    }
  </script>

  <!-- Estilos customizados -->
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

  <!-- Efeito Interativo Spotlight Suave -->
  <div id="cursorGlow" class="cursor-glow"></div>
  <div class="bg-ambient-1"></div>
  <div class="bg-ambient-2"></div>

  <!-- Card Principal Clean -->
  <div class="relative z-10 w-full max-w-md bg-white border border-slate-200/90 rounded-2xl overflow-hidden shadow-xl">
    
    <!-- Topo / Header da Marca -->
    <div class="p-6 pb-4 text-center border-b border-slate-100">
      <div class="w-12 h-12 mx-auto mb-3 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-md shadow-emerald-600/20 text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
        </svg>
      </div>

      <h1 class="text-xl font-extrabold tracking-tight text-slate-900">
        Chácaras <span class="text-emerald-600">Exclusivas</span>
      </h1>
      <p class="text-xs text-slate-500 mt-1 font-medium">São Francisco &bull; Magnólia &bull; Agendamento de Diárias</p>
    </div>

    <!-- Navegação de Abas (Entrar / Cadastrar) -->
    <div class="flex border-b border-slate-100 bg-slate-50 p-1">
      <button id="tabLogin" class="flex-1 py-2.5 text-xs uppercase font-bold tracking-wider rounded-xl transition-all duration-150 bg-white text-emerald-700 shadow-sm border border-slate-200/70">
        Entrar
      </button>
      <button id="tabCadastro" class="flex-1 py-2.5 text-xs uppercase font-bold tracking-wider rounded-xl transition-all duration-150 text-slate-500 hover:text-slate-800">
        Criar Conta
      </button>
    </div>

    <!-- Box de Alerta -->
    <div id="alertBox" class="hidden mx-6 mt-4 p-3 rounded-xl text-xs font-semibold"></div>

    <!-- Formulário de Login -->
    <form id="formLogin" action="/perform_login" method="POST" class="p-6 space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Seu E-mail</label>
        <div class="relative">
          <input
            type="email"
            name="username"
            required
            placeholder="exemplo@email.com"
            class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition shadow-sm font-medium">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Senha de Acesso</label>
        <div class="relative">
          <input
            type="password"
            name="password"
            required
            placeholder="••••••••"
            class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition shadow-sm font-medium">
        </div>
      </div>

      <button
        type="submit"
        class="w-full btn-glow text-white font-extrabold py-3.5 rounded-xl text-sm transition shadow-md flex items-center justify-center gap-2 cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
        </svg>
        <span>Entrar no Sistema</span>
      </button>

      <!-- Dica de Acesso Rápido -->
      <div class="pt-3 border-t border-slate-100 text-center">
        <p class="text-[11px] text-slate-500">
          Acesso padrão de administrador: <strong class="text-emerald-700 font-bold">admin@chacaras.com</strong> (senha: <span class="text-slate-700 font-semibold">admin123</span>)
        </p>
      </div>
    </form>

    <!-- Formulário de Cadastro -->
    <form id="formCadastro" class="hidden p-6 space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Nome Completo</label>
        <input
          type="text"
          id="nomeCompleto"
          required
          minlength="3"
          placeholder="Seu nome completo"
          class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition shadow-sm font-medium">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">E-mail</label>
        <input
          type="email"
          id="emailCadastro"
          required
          placeholder="seu@email.com"
          class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition shadow-sm font-medium">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Senha (mínimo 8 caracteres)</label>
        <input
          type="password"
          id="senhaCadastro"
          required
          minlength="8"
          placeholder="••••••••"
          class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition shadow-sm font-medium">
      </div>

      <button
        type="submit"
        id="btnCriarConta"
        class="w-full btn-glow text-white font-extrabold py-3.5 rounded-xl text-sm transition shadow-md flex items-center justify-center gap-2 cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
        <span>Criar Minha Conta</span>
      </button>
    </form>

  </div>

  <!-- Script da Página de Login -->
  <script src="/js/login.js"></script>
</body>
</html>
